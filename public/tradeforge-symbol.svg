<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tf-symbol-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B7FFF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="tf-symbol-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="tf-symbol-arm" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Top bar of T: Chamfered horizontal bar with smooth gradient -->
  <path d="M 14 26 L 146 26 L 124 50 L 36 50 Z" fill="url(#tf-symbol-top)" />

  <!-- Left vertical stem of T: Chamfered bottom chevron tip -->
  <path d="M 36 58 L 66 58 L 66 114 L 51 136 L 36 116 Z" fill="url(#tf-symbol-stem)" />

  <!-- F arm: Vertical segment with rightward arm, angled chamfer on right tip -->
  <path d="M 76 58 L 100 58 L 100 75 L 134 75 L 118 95 L 100 95 L 100 116 L 76 127 Z" fill="url(#tf-symbol-arm)" />
</svg>
