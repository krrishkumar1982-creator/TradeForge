<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tf-logo-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B7FFF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="tf-logo-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="tf-logo-arm" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="tf-logo-forge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B7FFF" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="65%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- TF Emblem Group -->
  <g transform="translate(8, 0)">
    <!-- Top bar of T -->
    <path d="M 14 26 L 146 26 L 124 50 L 36 50 Z" fill="url(#tf-logo-top)" />
    <!-- Left vertical stem of T -->
    <path d="M 36 58 L 66 58 L 66 114 L 51 136 L 36 116 Z" fill="url(#tf-logo-stem)" />
    <!-- F arm -->
    <path d="M 76 58 L 100 58 L 100 75 L 134 75 L 118 95 L 100 95 L 100 116 L 76 127 Z" fill="url(#tf-logo-arm)" />
  </g>

  <!-- TradeForge Wordmark -->
  <g transform="translate(168, 96)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="70" letter-spacing="-1">
      <tspan fill="#0F172A" x="0">Trade</tspan>
      <tspan fill="url(#tf-logo-forge)" dx="2">Forge</tspan>
    </text>
  </g>
</svg>
